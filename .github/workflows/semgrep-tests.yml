name: Semgrep rule tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Keep in sync with docs/setup-guide.md.
  SEMGREP_VERSION: "1.180.0"

jobs:
  rule-tests:
    name: Validate and test rule pack
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Semgrep ${{ env.SEMGREP_VERSION }}
        run: |
          python -m pip install --upgrade pip
          python -m pip install "semgrep==${SEMGREP_VERSION}"
          semgrep --version

      - name: Validate rule syntax
        run: semgrep --metrics=off --validate --config rules/

      - name: Run rule tests
        # One rule file at a time, the same script contributors run locally.
        # It fails on a missing fixture, a Semgrep error, or "No unit tests
        # found" as well as on a failing annotation.
        run: |
          set -o pipefail
          scripts/run-tests.sh | tee semgrep-test-output.txt

      - name: Check vulnerable and secure examples
        run: |
          set -o pipefail
          scripts/check-examples.sh | tee examples-output.txt

      - name: Publish summary
        if: always()
        run: |
          {
            echo "## Semgrep ${SEMGREP_VERSION} rule tests"
            echo '```'
            cat semgrep-test-output.txt 2>/dev/null || echo "not run"
            echo '```'
            echo "## Examples"
            echo '```'
            cat examples-output.txt 2>/dev/null || echo "not run"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

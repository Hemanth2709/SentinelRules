rules:
  - id: sentinel-next-public-secret-env
    languages:
      - typescript
      - javascript
    severity: ERROR
    message: >-
      The environment variable '$NAME' uses the NEXT_PUBLIC_ prefix and its
      name indicates a credential. Next.js inlines NEXT_PUBLIC_ values into
      the JavaScript sent to browsers, so anyone can read it. Move the value
      to a server-only variable (no NEXT_PUBLIC_ prefix), read it only in
      server code, and rotate it if it has already been deployed.
    metadata:
      category: security
      subcategory:
        - vuln
      confidence: MEDIUM
      likelihood: HIGH
      impact: HIGH
      technology:
        - nextjs
        - react
      cwe:
        - "CWE-200: Exposure of Sensitive Information to an Unauthorized Actor"
        - "CWE-522: Insufficiently Protected Credentials"
      owasp:
        - "A01:2021 - Broken Access Control"
        - "A05:2021 - Security Misconfiguration"
      references:
        - https://nextjs.org/docs/app/guides/environment-variables#bundling-environment-variables-for-the-browser
        - https://nextjs.org/docs/app/guides/data-security
      documentation: docs/features/04-next-public-secrets/README.md
    patterns:
      - pattern-either:
          # Reading the variable: process.env.NEXT_PUBLIC_X
          - pattern: process.env.$NAME
          # Reading the variable: process.env["NEXT_PUBLIC_X"]
          - patterns:
              - pattern: process.env[$KEY]
              - metavariable-pattern:
                  metavariable: $KEY
                  pattern: '"$NAME"'
          # Destructuring: const { NEXT_PUBLIC_X } = process.env
          # (also renamed: { NEXT_PUBLIC_X: alias }). Added in v0.3.0.
          - patterns:
              - pattern-either:
                  - pattern: "const {..., $NAME, ...} = process.env"
                  - pattern: "const {..., $NAME: $ALIAS, ...} = process.env"
                  - pattern: "let {..., $NAME, ...} = process.env"
              - focus-metavariable: $NAME
          # Declaring the variable in next.config.js `env: { ... }`.
          - patterns:
              - pattern-inside: "{..., env: {...}, ...}"
              - pattern: "{..., $NAME: $VALUE, ...}"
              - focus-metavariable: $NAME
      - metavariable-regex:
          metavariable: $NAME
          # Clear credential indicators, or (v0.3.0) a key or token from a
          # provider that issues no browser-safe keys (LLM, email, SMS and
          # source-hosting APIs). Generic words such as TOKEN or API_KEY on
          # their own stay excluded: many providers (maps, search, analytics)
          # issue keys designed to be public.
          regex: ^"?NEXT_PUBLIC_(\w*(SECRET|PRIVATE|PASSWORD|PASSWD|SERVICE_ROLE|SERVICE_ACCOUNT|DATABASE_URL|DB_URL|CONNECTION_STRING|CREDENTIAL|SIGNING_KEY|ENCRYPTION_KEY|ADMIN_KEY|MASTER_KEY)\w*|\w*(OPENAI|ANTHROPIC|GROQ|MISTRAL|COHERE|REPLICATE|HUGGING_?FACE|DEEPSEEK|SENDGRID|RESEND|MAILGUN|POSTMARK|TWILIO)\w*(KEY|TOKEN)\w*|\w*(GITHUB|GITLAB|NPM|SLACK|DISCORD|HF)_\w*TOKEN\w*)"?$
      # Names that state the value is meant to be public.
      - metavariable-regex:
          metavariable: $NAME
          regex: ^(?!"?NEXT_PUBLIC_\w*(PUBLISHABLE|PUBLIC_KEY|ANON_KEY)).*

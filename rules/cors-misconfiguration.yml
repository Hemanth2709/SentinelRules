rules:
  - id: sentinel-cors-credentials-any-origin
    languages:
      - typescript
      - javascript
    severity: ERROR
    message: >-
      CORS is configured to allow credentials while accepting any requesting
      origin (`origin: true`, an origin callback that always allows, or a
      reflected Origin header). Any website a signed-in user visits can then
      make authenticated requests and read the responses. Use an explicit
      allowlist of trusted origins and compare the request origin against it.
    metadata:
      category: security
      subcategory:
        - vuln
      confidence: HIGH
      likelihood: MEDIUM
      impact: HIGH
      technology:
        - nodejs
        - express
        - nestjs
        - cors
      cwe:
        - "CWE-942: Permissive Cross-domain Policy with Untrusted Domains"
        - "CWE-346: Origin Validation Error"
      owasp:
        - "A05:2021 - Security Misconfiguration"
        - "A01:2021 - Broken Access Control"
      references:
        - https://docs.nestjs.com/security/cors
        - https://github.com/expressjs/cors#configuration-options
        - https://developer.mozilla.org/en-US/docs/Web/HTTP/CORS#requests_with_credentials
        - https://portswigger.net/web-security/cors
      documentation: docs/features/07-cors-misconfiguration/README.md
    pattern-either:
      # Options object for app.enableCors(), cors(), or NestFactory.create(..., { cors })
      # `origin: true` makes the cors package reflect the request's Origin.
      - pattern: "{..., origin: true, ..., credentials: true, ...}"
      # Origin callback that allows every origin.
      - pattern: "{..., origin: ($ORIGIN, $CB) => $CB(null, true), ..., credentials: true, ...}"
      - pattern: "{..., origin: ($ORIGIN, $CB) => { ... $CB(null, true); }, ..., credentials: true, ...}"
      - pattern: "{..., origin: function ($ORIGIN, $CB) { ... $CB(null, true); }, ..., credentials: true, ...}"
      # Origin callback that echoes back whatever origin was sent.
      - pattern: "{..., origin: ($ORIGIN, $CB) => $CB(null, $ORIGIN), ..., credentials: true, ...}"
      # Manual headers: reflect the request Origin and allow credentials.
      - patterns:
          - pattern-either:
              - pattern: |
                  $RES.$SET("Access-Control-Allow-Origin", $REQ.headers.origin);
                  ...
                  $RES.$SET("Access-Control-Allow-Credentials", "true");
              - pattern: |
                  $RES.$SET("Access-Control-Allow-Credentials", "true");
                  ...
                  $RES.$SET("Access-Control-Allow-Origin", $REQ.headers.origin);
              - pattern: |
                  $RES.$SET("Access-Control-Allow-Origin", $REQ.header("origin"));
                  ...
                  $RES.$SET("Access-Control-Allow-Credentials", "true");
          - metavariable-regex:
              metavariable: $SET
              regex: ^(setHeader|header|set)$
      # v0.3.0: Web Fetch API headers (Next.js route handlers, middleware),
      # where the Origin comes from `request.headers.get('origin')`.
      - patterns:
          - pattern-either:
              - pattern: |
                  $H.$SET("Access-Control-Allow-Origin", <... $REQ.headers.get($O) ...>);
                  ...
                  $H2.$SET("Access-Control-Allow-Credentials", "true");
              - pattern: |
                  $H2.$SET("Access-Control-Allow-Credentials", "true");
                  ...
                  $H.$SET("Access-Control-Allow-Origin", <... $REQ.headers.get($O) ...>);
          - metavariable-regex:
              metavariable: $SET
              regex: ^(set|append)$
          - metavariable-regex:
              metavariable: $O
              regex: (?i)^["'`]origin["'`]$

  - id: sentinel-cors-weak-origin-check
    languages:
      - typescript
      - javascript
    severity: WARNING
    message: >-
      This origin check can be passed by an attacker-registered origin:
      `endsWith` or `includes` without a leading dot, `startsWith` without a
      trailing `/`, or a regular expression that is not anchored at both ends
      (for example `evil-example.com` ends with `example.com`). Compare
      against an exact allowlist, or anchor the pattern and require a
      leading dot for subdomains.
    metadata:
      category: security
      subcategory:
        - vuln
      confidence: MEDIUM
      likelihood: MEDIUM
      impact: MEDIUM
      technology:
        - nodejs
        - express
        - nestjs
        - nextjs
      cwe:
        - "CWE-346: Origin Validation Error"
        - "CWE-942: Permissive Cross-domain Policy with Untrusted Domains"
      owasp:
        - "A05:2021 - Security Misconfiguration"
        - "A01:2021 - Broken Access Control"
      references:
        - https://portswigger.net/web-security/cors#errors-parsing-origin-headers
        - https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/Access-Control-Allow-Origin
      documentation: docs/features/07-cors-misconfiguration/README.md
    patterns:
      - pattern-either:
          # Suffix or substring checks without a leading dot.
          - patterns:
              - pattern-either:
                  - pattern: $O.endsWith($S)
                  - pattern: $O.includes($S)
              - metavariable-regex:
                  metavariable: $S
                  regex: ^["'`][^."'`]
          # Prefix checks that stop at the host (no trailing slash).
          - patterns:
              - pattern: $O.startsWith($S)
              - metavariable-regex:
                  metavariable: $S
                  regex: ^["'`]https?://[^/"'`]+["'`]$
          # Regular expressions not anchored at both ends.
          - patterns:
              - pattern: $RE.test($O)
              - metavariable-regex:
                  metavariable: $RE
                  regex: ^/([^^].*|\^.*[^$])/[a-z]*$
      # Only values that are clearly the request origin.
      - metavariable-regex:
          metavariable: $O
          regex: (?i)^(origin|requestorigin|reqorigin|originheader)$
